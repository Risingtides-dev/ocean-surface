<div class="cap">solid dome &middot; surge current</div>
<script>
// SHARP water: each layer SURGES one full period per stroke — velocity
// visibly attacks and releases (power ease), seam lands at zero-velocity.
function surgeFlow(sel, dist, dur, delay=0) {
  gsap.fromTo(sel, { x: 0 }, { x: dist, duration: dur, ease: "power2.inOut",
    repeat: -1, delay, onRepeat: () => gsap.set(sel, { x: 0 }) });
}
surgeFlow("#w1",  16, 1.9);          // strikes right
surgeFlow("#w2", -16, 2.5, .45);     // answers left — counter-churn
surgeFlow("#deep",16, 3.2, .9);      // deep mass rolls late
// bob: fast rise, slow settle — a real swell, not float
gsap.timeline({ repeat: -1 })
  .to("#water", { y: -1.8, duration: .55, ease: "power3.out" })
  .to("#water", { y: 0,    duration: 1.35, ease: "sine.inOut" });
// light snaps across the dome
gsap.timeline({ repeat: -1, repeatDelay: 1.6 })
  .fromTo("#sheen", { x: -12, opacity: 0 }, { x: 34, opacity: 1, duration: .9, ease: "power3.inOut" })
  .to("#sheen", { opacity: 0, duration: .25 }, ">-.15");
</script>
