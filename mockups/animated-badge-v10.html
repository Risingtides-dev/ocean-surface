<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const PX = 16.0;  // one full period in viewBox units
// entrance: coin settles, layers rise, letters mask-reveal — then perpetual current
document.querySelectorAll('.mark').forEach((m, idx) => {
  const layers = m.querySelectorAll('.lyr');
  const tl = gsap.timeline({ delay: idx ? .35 : .05 });
  tl.from(m, { scale: .93, opacity: 0, duration: .7, ease: 'power3.out', transformOrigin: '50% 50%' })
    .from(layers, { y: 3.2, opacity: 0, duration: .65, ease: 'power2.out', stagger: .09 }, '-=.4');
  // the current: same direction, parallax, seamless (exactly one period per loop)
  const speed = m.classList.contains('small') ? .78 : 1;
  [['.f-land', 4.4], ['.f-w1', 1.7], ['.f-w2', 2.4], ['.f-deep', 3.3]].forEach(([sel, dur]) => {
    gsap.to(m.querySelectorAll(sel), { x: -PX, duration: dur*speed, ease: 'none', repeat: -1 });
  });
  gsap.to(m.querySelectorAll('.lyr'), { y: -.55, duration: 1.9, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: .22 });
  if (m.classList.contains('small')) gsap.to(m, { scale: 1.04, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 50%' });
});
gsap.to('.word span', { y: 0, duration: .8, ease: 'power3.out', stagger: .055, delay: .55 });
gsap.to('.tag', { opacity: 1, duration: .9, delay: 1.15 });
</script></body></html>
