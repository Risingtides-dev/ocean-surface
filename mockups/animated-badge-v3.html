<div class="cap">one current &middot; parallax depth</div>
<script>
// ONE SPINNING CURRENT: every layer flows the SAME direction, continuous,
// no pulses. Parallax speeds (front fast, deep slow) = rotating water drum.
gsap.to("#w1g",   { x: 16, duration: 2.8, ease: "none", repeat: -1 });
gsap.to("#w2g",   { x: 16, duration: 3.8, ease: "none", repeat: -1 });

// one slow organic breath of the whole body — no twitch
gsap.to("#water", { y: -1.0, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: -1 });
</script>
