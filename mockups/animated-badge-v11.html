<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
// LIVING WATER — each edge is y(x,t): dominant traveling wave + harmonics
// + a weak counter-traveling component -> interference: crests swell, collapse,
// pass through each other. Geometry morphs every frame; nothing translates.
const LAYERS = [
  { id: 'l1', y0: 15.8, A: 1.35, c: 4.5, ph: 0.4, type: 'top' },
  { id: 'l2', y0: 19.6, A: 1.15, c: 3.4, ph: 2.3, type: 'rib', th: 3.8 },
  { id: 'l3', y0: 27.2, A: 1.10, c: 2.6, ph: 4.4, type: 'rib', th: 2.6 },
  { id: 'l4', y0: 33.2, A: 1.00, c: 2.0, ph: 3.3, type: 'deep' },
];
const K1 = 2*Math.PI/16, K2 = 2*Math.PI/9.5, K3 = 2*Math.PI/23;
const X0 = 1.5, X1 = 46.5, STEP = 0.6, MINGAP = 0.85;
const XS = []; for (let x = X0; x <= X1 + 1e-6; x += STEP) XS.push(x);
function edgeY(L, x, t, lag) {
  const tt = t - (lag||0);
  const am1 = 1 + 0.24*Math.sin(1.35*tt + L.ph*2.1);        // crests swell + collapse
  const am2 = 1 + 0.30*Math.sin(0.9*tt + L.ph + 2.6);
  // gusts: amplitude varies ALONG the edge, not just in time
  const g = 1 + 0.28*Math.sin(0.55*K1*x + 0.31*tt + L.ph*1.3);
  // turbulent cascade: eddies at descending scales, wandering (non-periodic) phases
  const e1 = 0.30*Math.sin(2.6*K1*x - L.c*1.6*K1*tt + L.ph*3 + 0.8*Math.sin(0.23*tt + L.ph));
  const e2 = 0.16*Math.sin(5.3*K1*x + L.c*0.9*K1*tt + L.ph*7 + 0.6*Math.sin(0.31*tt + 2*L.ph));
  const e3 = 0.08*Math.sin(9.7*K1*x - L.c*2.3*K1*tt + 0.5*Math.sin(0.41*tt));
  return L.y0
    + L.A * ( g * ( am1 * Math.sin(K1*x - L.c*K1*tt + L.ph)
    + 0.42 * am2 * Math.sin(K2*x - L.c*1.9*K2*tt + L.ph*1.7 + 0.9)
    + 0.34 * Math.sin(K3*x + L.c*1.1*K3*tt + L.ph*0.6 + 2.1) )
    + e1 + e2 + e3 );
}
function dOf(xs, ys, rev) {
  let d = '';
  if (rev) { for (let i = xs.length-1; i >= 0; i--) d += ' L ' + xs[i].toFixed(2) + ' ' + ys[i].toFixed(2); return d; }
  for (let i = 0; i < xs.length; i++) d += (d ? ' L ' : 'M ') + xs[i].toFixed(2) + ' ' + ys[i].toFixed(2);
  return d;
}
function tick() {
  const t = gsap.ticker.time;
  // 1) raw edges, pointwise
  for (const L of LAYERS) {
    L.top = XS.map(x => edgeY(L, x, t));
    L.bot = L.type === 'rib'
      ? XS.map(x => edgeY(L, x, t, 0.30) + L.th + 0.22*Math.sin(K2*x + 1.1*t + L.ph))
      : L.top;
  }
  // 2) the splits are law: push colliding edges apart around their midpoint
  for (let i = 0; i < LAYERS.length-1; i++) {
    const a = LAYERS[i], b = LAYERS[i+1];
    for (let j = 0; j < XS.length; j++) {
      const gap = b.top[j] - a.bot[j];
      if (gap < MINGAP) {
        const push = (MINGAP - gap) / 2;
        a.bot[j] -= push; b.top[j] += push;
        if (a.type === 'rib' && a.bot[j] < a.top[j] + 0.6) a.bot[j] = a.top[j] + 0.6;
      }
    }
  }
  // 3) write geometry
  for (const L of LAYERS) {
    const top = dOf(XS, L.top);
    let fill;
    if (L.type === 'top')       fill = top + ' L 46.5 -6 L 1.5 -6 Z';
    else if (L.type === 'deep') fill = top + ' L 46.5 50 L 1.5 50 Z';
    else                        fill = top + dOf(XS, L.bot, true) + ' Z';
    document.querySelectorAll('.fill-' + L.id).forEach(p => p.setAttribute('d', fill));
    document.querySelectorAll('.edge-' + L.id).forEach(p => p.setAttribute('d', top));
    if (L.type === 'rib') { const botD = dOf(XS, L.bot);
      document.querySelectorAll('.edgeb-' + L.id).forEach(p => p.setAttribute('d', botD)); }
    // FOAM: patchy, only where crests peak; strong core + soft wash
    const foam = (ys, dir, base) => {
      let strong = '', soft = '';
      for (let j = 0; j < XS.length; j++) {
        const dev = dir * (base - ys[j]) / L.A;            // outward swell 0..~1.6
        const jit = 0.10*Math.sin(XS[j]*9.7 + L.ph*5 + t*0.6) + 0.06*Math.sin(XS[j]*17.3 - t*0.4);
        const y = (ys[j] - dir*(0.16 + 0.3*Math.max(0, dev-0.2)) + jit).toFixed(2);
        const pt = XS[j].toFixed(2) + ' ' + y;
        const prevIn = j > 0 && strong.endsWith('_');       // sentinel per-band runs
        if (dev > 0.55)      strong += (strong.endsWith('_') ? ' L ' + pt : ' M ' + pt) + '';
        if (dev > 0.55) strong += '_';
        if (dev > 0.18) soft += (soft.endsWith('_') ? ' L ' + pt : ' M ' + pt) + '_';
      }
      return { strong: strong.replaceAll('_',''), soft: soft.replaceAll('_','') };
    };
    const fTop = foam(L.top, 1, L.y0);
    document.querySelectorAll('.fs-' + L.id).forEach(p => p.setAttribute('d', fTop.strong));
    document.querySelectorAll('.fw-' + L.id).forEach(p => p.setAttribute('d', fTop.soft));
    if (L.type === 'rib') {
      const fBot = foam(L.bot, -1, L.y0 + L.th);
      document.querySelectorAll('.fs-b-' + L.id).forEach(p => p.setAttribute('d', fBot.strong));
      document.querySelectorAll('.fw-b-' + L.id).forEach(p => p.setAttribute('d', fBot.soft));
    }
  }
}
gsap.ticker.add(tick);
document.querySelectorAll('.mark').forEach((m, idx) => {
  gsap.timeline({ delay: idx ? .3 : .05 })
    .from(m, { scale: .93, opacity: 0, duration: .7, ease: 'power3.out', transformOrigin: '50% 50%' })
    .from(m.querySelectorAll('.lyr'), { y: 3.2, opacity: 0, duration: .65, ease: 'power2.out', stagger: .09 }, '-=.4');
  if (m.classList.contains('small'))
    gsap.to(m, { scale: 1.04, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: -1, transformOrigin: '50% 50%' });
});
gsap.to('.word span', { y: 0, duration: .8, ease: 'power3.out', stagger: .055, delay: .5 });
</script></body></html>
