<!doctype html><html><head><meta charset="utf-8"><title>OCEAN v18</title><style>
*{box-sizing:border-box;margin:0}
body{background:#050d13;min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#e8f4f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.scene{width:500px;height:500px;filter:drop-shadow(0 20px 50px rgba(2,10,16,.6))}
.replay{margin-top:20px;background:#0b1c26;border:1px solid #143246;color:#7fb5c4;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer}
</style></head><body>
<svg class="scene" viewBox="0 0 600 600" fill="none">
 <defs>
  <clipPath id="spread"><rect id="spreadR" x="300" y="0" width="0" height="600"/></clipPath>
  <clipPath id="tide"><path id="tideP" d="M0 610 L600 610 L600 610 L0 610 Z"/></clipPath>
  <linearGradient id="waterBody" x1="0" y1="150" x2="0" y2="600" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2ea6c6" stop-opacity=".42"/><stop offset=".5" stop-color="#1c63b0" stop-opacity=".5"/><stop offset="1" stop-color="#0a1642" stop-opacity=".62"/></linearGradient>
  <linearGradient id="dripRamp" x1="0" y1="-8" x2="0" y2="8" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#57e0c8"/><stop offset=".5" stop-color="#2a86c0"/><stop offset="1" stop-color="#16307e"/></linearGradient>
  <filter id="foamGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
 </defs>

 <!-- water body (clipped by the spreading reveal) -->
 <g clip-path="url(#spread)">
   <path id="body" fill="url(#waterBody)" d=""/>
 </g>
 <!-- OCEAN: per-letter solid depth ramp, revealed only below the surface -->
 <g clip-path="url(#tide)" font-family="-apple-system,system-ui,sans-serif" font-weight="700" font-size="88" text-anchor="middle">
   <text x="100" y="330" fill="#0087AF">O</text>
   <text x="200" y="330" fill="#00AFD7">C</text>
   <text x="300" y="330" fill="#00D7D7">E</text>
   <text x="400" y="330" fill="#00FFD7">A</text>
   <text x="500" y="330" fill="#5FFFFF">N</text>
 </g>
 <!-- the surface (rich waterline), clipped by the spread too -->
 <g clip-path="url(#spread)">
   <path id="crestGlow" fill="none" stroke="#bfeff8" stroke-width="5" stroke-linecap="round" stroke-opacity=".34" filter="url(#foamGlow)" opacity="0"/>
   <path id="crest" fill="none" stroke="#eafcff" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".9" opacity="0"/>
   <g id="flecks" opacity="0"></g>
 </g>
 <!-- the orb (living-water badge), bobs on the surface -->
 <g id="orbG"><svg id="orb" x="222" y="70" width="156" height="156" viewBox="0 0 48 48" fill="none"></svg></g>
 <!-- the drip: a mini-orb, not an emoji -->
 <g id="drip" opacity="0">
   <ellipse id="dripBody" rx="7.5" ry="8.5" fill="url(#dripRamp)"/>
   <path id="dripHi" d="M-3 -4 Q0 -6.5 3 -4" fill="none" stroke="#bfeee0" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".55"/>
 </g>
</svg>
<button class="replay" id="replay">replay</button>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const NS="http://www.w3.org/2000/svg";
// ---------- orb: six-strata living water ----------
const EDGES=[{y0:14.0,a:1.50,k:0.33,spd:0.85,ph:0.2},{y0:20.4,a:1.15,k:0.44,spd:1.05,ph:1.5},{y0:25.2,a:0.92,k:0.52,spd:0.75,ph:2.8},{y0:31.6,a:0.82,k:0.40,spd:0.95,ph:4.0},{y0:36.6,a:0.66,k:0.58,spd:0.68,ph:5.2}];
const STEP=0.4,X0=1.5,X1=46.5;
function ey(E,x,t){const br=1+0.11*Math.sin(0.55*t+E.ph);const s=Math.sin(E.k*x-E.spd*t+E.ph)+0.44*Math.sin(1.7*E.k*x-1.28*E.spd*t+E.ph*1.6+0.7);return E.y0+E.a*br*s+E.a*0.09*Math.sin(3.0*E.k*x+0.5*E.spd*t+E.ph);}
function samp(E,t){const p=[];for(let x=X0;x<=X1+0.01;x+=STEP)p.push([x,ey(E,x,t)]);return p;}
function bandTop(top,by){let d="M"+top[0][0].toFixed(2)+" "+top[0][1].toFixed(2);for(let i=1;i<top.length;i++)d+="L"+top[i][0].toFixed(2)+" "+top[i][1].toFixed(2);return d+"L"+X1+" "+by+"L"+X0+" "+by+"Z";}
function band2(t,b){let d="M"+t[0][0].toFixed(2)+" "+t[0][1].toFixed(2);for(let i=1;i<t.length;i++)d+="L"+t[i][0].toFixed(2)+" "+t[i][1].toFixed(2);for(let i=b.length-1;i>=0;i--)d+="L"+b[i][0].toFixed(2)+" "+b[i][1].toFixed(2);return d+"Z";}
function edge(p){let d="M"+p[0][0].toFixed(2)+" "+p[0][1].toFixed(2);for(let i=1;i<p.length;i++)d+="L"+p[i][0].toFixed(2)+" "+p[i][1].toFixed(2);return d;}
const orb=document.getElementById("orb");
orb.innerHTML=`<defs><clipPath id="c"><circle cx="24" cy="24" r="20.4"/></clipPath>
<linearGradient id="ba" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="16"><stop offset="0" stop-color="#5ce3cb"/><stop offset="1" stop-color="#34bda8"/></linearGradient>
<linearGradient id="bb" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="22"><stop offset="0" stop-color="#33bab4"/><stop offset="1" stop-color="#1a7f98"/></linearGradient>
<linearGradient id="bc" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="0" y2="27"><stop offset="0" stop-color="#2a9cc0"/><stop offset="1" stop-color="#1a6fa0"/></linearGradient>
<linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="33"><stop offset="0" stop-color="#2c72c6"/><stop offset="1" stop-color="#184f94"/></linearGradient>
<linearGradient id="be" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="39"><stop offset="0" stop-color="#2a54c2"/><stop offset="1" stop-color="#14357e"/></linearGradient>
<linearGradient id="bf" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="46"><stop offset="0" stop-color="#233ba8"/><stop offset="1" stop-color="#0a1642"/></linearGradient>
<radialGradient id="bface" cx=".5" cy=".4" r=".64"><stop offset=".7" stop-color="#061127"/><stop offset="1" stop-color="#020813"/></radialGradient>
<radialGradient id="boccl"><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset=".97" stop-color="#000" stop-opacity=".46"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
<filter id="sf"><feGaussianBlur stdDeviation=".2"/></filter><filter id="cr"><feGaussianBlur stdDeviation=".05"/></filter></defs>
<circle cx="24" cy="24" r="21.6" fill="#0a1930"/><circle cx="24" cy="24" r="20.4" fill="url(#bface)"/>
<g clip-path="url(#c)">
<path class="p bf" fill="url(#bf)"/><path class="p be" fill="url(#be)"/><path class="p bd" fill="url(#bd)"/><path class="p bc" fill="url(#bc)"/><path class="p bb" fill="url(#bb)"/><path class="p ba" fill="url(#ba)"/>
<path class="s sB" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sC" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sD" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sE" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sF" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".47" filter="url(#sf)"/>
<path class="fa" fill="none" stroke="#f4feff" stroke-width=".3" stroke-linecap="round" stroke-opacity=".85" filter="url(#cr)"/>
<circle cx="24" cy="24" r="20.4" fill="url(#boccl)"/></g>`;
const q=s=>orb.querySelector(s);
const B={ba:q(".ba"),bb:q(".bb"),bc:q(".bc"),bd:q(".bd"),be:q(".be"),bf:q(".bf"),sB:q(".sB"),sC:q(".sC"),sD:q(".sD"),sE:q(".sE"),sF:q(".sF"),fa:q(".fa")};
const t0=performance.now();
gsap.ticker.add(()=>{const t=(performance.now()-t0)/1000*0.6;const A=samp(EDGES[0],t),b=samp(EDGES[1],t),c=samp(EDGES[2],t),d=samp(EDGES[3],t),e=samp(EDGES[4],t);
 B.ba.setAttribute("d",bandTop(A,2));B.bb.setAttribute("d",band2(A,b));B.bc.setAttribute("d",band2(b,c));B.bd.setAttribute("d",band2(c,d));B.be.setAttribute("d",band2(d,e));B.bf.setAttribute("d",bandTop(e,46));
 B.sB.setAttribute("d",edge(A));B.sC.setAttribute("d",edge(b));B.sD.setAttribute("d",edge(c));B.sE.setAttribute("d",edge(d));B.sF.setAttribute("d",edge(e));B.fa.setAttribute("d",edge(A));});

// ---------- scene reveal ----------
const W=600, POLE_Y=214, LAND_Y=498, ORB_BOTTOM=214, L_FINAL=196;
const tideP=document.getElementById("tideP"), body=document.getElementById("body");
const crest=document.getElementById("crest"), crestGlow=document.getElementById("crestGlow");
const flecks=document.getElementById("flecks"), spreadR=document.getElementById("spreadR");
const drip=document.getElementById("drip"), dripBody=document.getElementById("dripBody");
function waveTop(L,ph,amp){let s="";for(let x=0;x<=W;x+=8){const y=L+Math.sin(x*0.035+ph)*amp+Math.sin(x*0.08+ph*1.6)*amp*0.4;s+=(x===0?"M":"L")+x+" "+y.toFixed(1);}return s;}
function bodyD(L,ph,amp){return waveTop(L,ph,amp)+`L${W} 600 L0 600 Z`;}
for(let i=0;i<9;i++){const c=document.createElementNS(NS,"circle");c.setAttribute("r",(1+Math.random()*1.6).toFixed(1));c.setAttribute("fill","#eafcff");flecks.appendChild(c);}
const fleckEls=[...flecks.children];
const S={L:610,ph:0,amp:0};
function redraw(){const wl=waveTop(S.L,S.ph,S.amp);
  tideP.setAttribute("d",bodyD(S.L,S.ph,S.amp)); body.setAttribute("d",bodyD(S.L,S.ph,S.amp));
  crest.setAttribute("d",wl); crestGlow.setAttribute("d",wl);
  fleckEls.forEach((f,i)=>{const x=(i+0.5)/fleckEls.length*W+Math.sin(S.ph*1.2+i)*12;const y=S.L+Math.sin(x*0.035+S.ph)*S.amp-3-(i%2)*4;f.setAttribute("cx",x.toFixed(1));f.setAttribute("cy",y.toFixed(1));});}

let TL;
function play(){
  if(TL) TL.kill();
  gsap.set([crest,crestGlow,flecks],{opacity:0});
  gsap.set("#orbG",{y:0});
  gsap.set(spreadR,{attr:{x:300,width:0}});
  gsap.set(drip,{opacity:0,x:300,y:POLE_Y,transformOrigin:"50% 50%"});
  gsap.set(dripBody,{scaleY:1,scaleX:1,transformOrigin:"50% 50%"});
  S.L=610;S.ph=0;S.amp=0; redraw();
  TL=gsap.timeline({onUpdate:redraw});
  // 1) mini-orb drip swells at the south pole, pinches off
  TL.to(drip,{opacity:1,y:POLE_Y+6,duration:.34,ease:"power1.out"});
  TL.to(dripBody,{scaleY:1.25,scaleX:.85,duration:.14},"<.12");
  // 2) GRAVITY fall (down only), stretching like a real droplet
  TL.to(drip,{y:LAND_Y,duration:.6,ease:"power2.in"});
  TL.to(dripBody,{scaleY:1.7,scaleX:.72,duration:.5,ease:"power1.in"},"<");
  // 3) impact: no crown — the drip merges; water SPREADS from the point
  TL.to(drip,{opacity:0,duration:.1});
  TL.set(S,{L:LAND_Y});
  TL.set([crest,crestGlow,flecks],{opacity:1});
  TL.set(S,{amp:6});
  TL.to(spreadR,{attr:{x:0,width:W},duration:.5,ease:"power2.out"},"<");   // spread out from impact x
  // 4) then the whole surface RISES
  TL.to(S,{L:L_FINAL,duration:2.0,ease:"power2.out"},">-.15");
  TL.to(S,{ph:18,duration:2.0,ease:"none"},"<");
  TL.to(S,{amp:2.2,duration:2.0,ease:"power1.out"},"<");
  // 5) as the surface reaches the orb, buoyancy takes over: dip, bob, settle, idle
  TL.to("#orbG",{y:7,duration:.28,ease:"power2.out"},">-.5");   // water lifts to the hull, orb dips
  TL.to("#orbG",{y:-4,duration:1.6,ease:"elastic.out(1,0.4)"});  // rebound + damped settle
  TL.to("#orbG",{y:0,duration:2.6,ease:"sine.inOut",repeat:1,yoyo:true},">-.4"); // gentle idle bob
  // hold + loop
  TL.to({},{duration:1.0,onComplete:play});
}
document.getElementById("replay").onclick=play;
setTimeout(play,300);
</script></body></html>
