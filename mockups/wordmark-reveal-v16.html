<!doctype html><html><head><meta charset="utf-8"><title>OCEAN v16 reveal</title><style>
*{box-sizing:border-box;margin:0}
body{background:#050d13;min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#e8f4f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{width:150px;height:150px;filter:drop-shadow(0 16px 40px rgba(2,10,16,.7))}
#drop{position:relative}
.wm{width:420px;height:132px;overflow:visible}
.replay{margin-top:26px;background:#0b1c26;border:1px solid #143246;color:#7fb5c4;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer}
</style></head><body>
<div class="stage">
 <svg id="badge" class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"></svg>
 <svg class="wm" viewBox="0 0 420 132">
  <defs>
   <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="132" gradientUnits="userSpaceOnUse">
     <stop offset="0" stop-color="#5fe6cf"/><stop offset=".42" stop-color="#2a9ec4"/>
     <stop offset=".72" stop-color="#2f78c9"/><stop offset="1" stop-color="#3550d0"/></linearGradient>
   <clipPath id="tide"><path id="tidePath" d="M0 132 L420 132 L420 132 L0 132 Z"/></clipPath>
  </defs>
  <!-- ghost letters: where OCEAN will form (very faint) -->
  <text id="ghost" x="210" y="96" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-weight="700" font-size="76" letter-spacing="10" fill="#12303f" opacity=".28">OCEAN</text>
  <!-- water-filled letters, revealed by the rising tide clip -->
  <text id="fill" x="210" y="96" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-weight="700" font-size="76" letter-spacing="10" fill="url(#ramp)" clip-path="url(#tide)">OCEAN</text>
  <!-- the moving waterline surface -->
  <path id="waterline" fill="none" stroke="#eafcff" stroke-width="2" stroke-linecap="round" stroke-opacity=".7" opacity="0"/>
 </svg>
</div>
<button class="replay" id="replay">replay</button>
<!-- droplet lives in body overlay so it can travel from orb to word -->
<svg id="dropLayer" style="position:fixed;inset:0;pointer-events:none" width="100%" height="100%">
 <ellipse id="droplet" rx="5" ry="7" fill="url(#dg)" opacity="0"/>
 <defs><radialGradient id="dg" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#bff2ff"/><stop offset=".5" stop-color="#49cbe0"/><stop offset="1" stop-color="#1f7fb0"/></radialGradient></defs>
</svg>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const NS="http://www.w3.org/2000/svg";
// ---- badge (from v15, hero) ----
const EDGES=[{y0:14.0,a:1.50,k:0.33,spd:0.85,ph:0.2},{y0:20.4,a:1.15,k:0.44,spd:1.05,ph:1.5},{y0:25.2,a:0.92,k:0.52,spd:0.75,ph:2.8},{y0:31.6,a:0.82,k:0.40,spd:0.95,ph:4.0},{y0:36.6,a:0.66,k:0.58,spd:0.68,ph:5.2}];
const STEP=0.4,X0=1.5,X1=46.5;
function ey(E,x,t){const br=1+0.11*Math.sin(0.55*t+E.ph);const s=Math.sin(E.k*x-E.spd*t+E.ph)+0.44*Math.sin(1.7*E.k*x-1.28*E.spd*t+E.ph*1.6+0.7);return E.y0+E.a*br*s+E.a*0.09*Math.sin(3.0*E.k*x+0.5*E.spd*t+E.ph);}
function samp(E,t){const p=[];for(let x=X0;x<=X1+0.01;x+=STEP)p.push([x,ey(E,x,t)]);return p;}
function bandTop(top,by){let d="M"+top[0][0].toFixed(2)+" "+top[0][1].toFixed(2);for(let i=1;i<top.length;i++)d+="L"+top[i][0].toFixed(2)+" "+top[i][1].toFixed(2);return d+"L"+X1+" "+by+"L"+X0+" "+by+"Z";}
function band2(t,b){let d="M"+t[0][0].toFixed(2)+" "+t[0][1].toFixed(2);for(let i=1;i<t.length;i++)d+="L"+t[i][0].toFixed(2)+" "+t[i][1].toFixed(2);for(let i=b.length-1;i>=0;i--)d+="L"+b[i][0].toFixed(2)+" "+b[i][1].toFixed(2);return d+"Z";}
function edge(p){let d="M"+p[0][0].toFixed(2)+" "+p[0][1].toFixed(2);for(let i=1;i<p.length;i++)d+="L"+p[i][0].toFixed(2)+" "+p[i][1].toFixed(2);return d;}
const badge=document.getElementById("badge");
badge.innerHTML=`<defs><clipPath id="c"><circle cx="24" cy="24" r="20.4"/></clipPath>
<linearGradient id="ba" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="16"><stop offset="0" stop-color="#5ce3cb"/><stop offset="1" stop-color="#34bda8"/></linearGradient>
<linearGradient id="bb" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="22"><stop offset="0" stop-color="#33bab4"/><stop offset="1" stop-color="#1a7f98"/></linearGradient>
<linearGradient id="bc" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="0" y2="27"><stop offset="0" stop-color="#2a9cc0"/><stop offset="1" stop-color="#1a6fa0"/></linearGradient>
<linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="33"><stop offset="0" stop-color="#2c72c6"/><stop offset="1" stop-color="#184f94"/></linearGradient>
<linearGradient id="be" gradientUnits="userSpaceOnUse" x1="0" y1="32" x2="0" y2="39"><stop offset="0" stop-color="#2a54c2"/><stop offset="1" stop-color="#14357e"/></linearGradient>
<linearGradient id="bf" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="46"><stop offset="0" stop-color="#233ba8"/><stop offset="1" stop-color="#0a1642"/></linearGradient>
<radialGradient id="bface" cx=".5" cy=".4" r=".64"><stop offset=".7" stop-color="#061127"/><stop offset="1" stop-color="#020813"/></radialGradient>
<radialGradient id="boccl"><stop offset=".78" stop-color="#000" stop-opacity="0"/><stop offset=".97" stop-color="#000" stop-opacity=".46"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
<filter id="sf"><feGaussianBlur stdDeviation=".2"/></filter><filter id="cr"><feGaussianBlur stdDeviation=".05"/></filter></defs>
<circle cx="24" cy="24" r="21.6" fill="#0a1930"/><circle cx="24" cy="24" r="20.4" fill="url(#bface)"/>
<g clip-path="url(#c)">
<path class="p bf" fill="url(#bf)"/><path class="p be" fill="url(#be)"/><path class="p bd" fill="url(#bd)"/><path class="p bc" fill="url(#bc)"/><path class="p bb" fill="url(#bb)"/><path class="p ba" fill="url(#ba)"/>
<path class="s sB" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sC" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sD" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sE" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".55" filter="url(#sf)"/><path class="s sF" fill="none" stroke="#05101f" stroke-width=".3" stroke-opacity=".47" filter="url(#sf)"/>
<path class="fa" fill="none" stroke="#f4feff" stroke-width=".3" stroke-linecap="round" stroke-opacity=".85" filter="url(#cr)"/>
<circle cx="24" cy="24" r="20.4" fill="url(#boccl)"/></g>`;
const q=s=>badge.querySelector(s);
const B={ba:q(".ba"),bb:q(".bb"),bc:q(".bc"),bd:q(".bd"),be:q(".be"),bf:q(".bf"),sB:q(".sB"),sC:q(".sC"),sD:q(".sD"),sE:q(".sE"),sF:q(".sF"),fa:q(".fa")};
const t0=performance.now();
gsap.ticker.add(()=>{const t=(performance.now()-t0)/1000*0.6;const A=samp(EDGES[0],t),b=samp(EDGES[1],t),c=samp(EDGES[2],t),d=samp(EDGES[3],t),e=samp(EDGES[4],t);
 B.ba.setAttribute("d",bandTop(A,2));B.bb.setAttribute("d",band2(A,b));B.bc.setAttribute("d",band2(b,c));B.bd.setAttribute("d",band2(c,d));B.be.setAttribute("d",band2(d,e));B.bf.setAttribute("d",bandTop(e,46));
 B.sB.setAttribute("d",edge(A));B.sC.setAttribute("d",edge(b));B.sD.setAttribute("d",edge(c));B.sE.setAttribute("d",edge(d));B.sF.setAttribute("d",edge(e));B.fa.setAttribute("d",edge(A));});

// ---- tide reveal ----
const tidePath=document.getElementById("tidePath");
const waterline=document.getElementById("waterline");
const fill=document.getElementById("fill");
const droplet=document.getElementById("droplet");
const WM_W=420, WM_H=132;
// build a wavy path: top edge at level L (with traveling wave), filled down to H
function tideD(L,ph,amp){let d=`M0 ${L}`;for(let x=0;x<=WM_W;x+=14){const y=L+Math.sin(x*0.045+ph)*amp+Math.sin(x*0.09+ph*1.7)*amp*0.4;d+=`L${x} ${y.toFixed(1)}`;}d+=`L${WM_W} ${WM_H} L0 ${WM_H} Z`;return d;}
function waterD(L,ph,amp){let d=`M0 ${L}`;for(let x=0;x<=WM_W;x+=14){const y=L+Math.sin(x*0.045+ph)*amp+Math.sin(x*0.09+ph*1.7)*amp*0.4;d+=`L${x} ${y.toFixed(1)}`;}return d;}

function rectOfBadgeBottom(){const r=badge.getBoundingClientRect();return {x:r.left+r.width/2, y:r.top+r.height*0.9};}
function rectOfWordTop(){const r=document.querySelector(".wm").getBoundingClientRect();return {x:r.left+r.width/2, y:r.top+r.height*0.86, top:r.top, h:r.height};}

let TL;
function play(){
  if(TL) TL.kill();
  gsap.set(fill,{opacity:1});
  gsap.set(tidePath,{attr:{d:tideD(WM_H,0,0)}});   // empty
  gsap.set(waterline,{opacity:0});
  const st=rectOfBadgeBottom(), en=rectOfWordTop();
  gsap.set(droplet,{attr:{cx:st.x,cy:st.y},opacity:0,scaleX:1,scaleY:1,transformOrigin:"50% 50%"});
  const state={L:WM_H,ph:0,amp:0};
  TL=gsap.timeline({onUpdate:()=>{ // redraw tide each tick while active
     tidePath.setAttribute("d",tideD(state.L,state.ph,state.amp));
     waterline.setAttribute("d",waterD(state.L,state.ph,state.amp));
  }});
  // 1) droplet swells at orb, releases
  TL.to(droplet,{opacity:1,duration:.18});
  TL.to(droplet,{attr:{cy:st.y+10},scaleY:1.4,scaleX:.8,duration:.22,ease:"power1.in"});
  // 2) falls to the word, stretching
  TL.to(droplet,{attr:{cx:en.x,cy:en.y},scaleY:1.7,scaleX:.72,duration:.5,ease:"power2.in"});
  // 3) impact: droplet vanishes, waterline appears, ripple amp pops
  TL.to(droplet,{opacity:0,scaleY:.4,scaleX:1.6,duration:.12},">-.02");
  TL.set(waterline,{opacity:.75});
  TL.set(state,{amp:5});
  // 4) tide floods up through the letters, waves easing calmer as it fills
  TL.to(state,{L:6,duration:1.0,ease:"power2.out"},"<");
  TL.to(state,{ph:14,duration:1.0,ease:"none"},"<");
  TL.to(state,{amp:1.6,duration:1.0,ease:"power2.out"},"<");
  // 5) settle: waterline glides off the top + fades; word bobs
  TL.to(waterline,{opacity:0,duration:.4},">-.15");
  TL.fromTo(fill,{y:3},{y:0,duration:.5,ease:"elastic.out(1,0.55)"},"<");
  // loop
  TL.to({},{duration:1.3,onComplete:play});
}
document.getElementById("replay").onclick=play;
window.addEventListener("load",()=>setTimeout(play,300));
play();
</script></body></html>
